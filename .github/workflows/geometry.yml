name: Port outlines

# Two jobs share one build step, `rake seaports:geometry`, which fetches the
# OpenStreetMap features each selection in data/geometry/sources names and
# rewrites data/geometry/<LOCODE>.geojson when they pass their checks.
#
# - On a pull request that touches a port's selection or its outline (a
#   person's edit, or a reader's correction sent from Trackberry), it
#   rebuilds from OpenStreetMap each port whose outline was not built from
#   its selection as it stands, and commits the result to the same branch, so
#   the reviewer sees the shapes and not only the ids. A port whose outline
#   carries its selection's digest (built locally with rake seaports:geometry
#   and committed with it) is not fetched again: Overpass is slow and
#   rate-limited, and a batch of ports would otherwise take most of an hour.
#   An outline the pull request edits without its selection is always
#   rebuilt, so a hand edit is overwritten as before. Each port gets one build,
#   whose Overpass client already tries both instances three times, under a
#   time limit that covers that; one that fails does not stop the others. A
#   selection that fails its checks fails this job, with the reasons in the
#   log.
#
#   The digest is a fingerprint, not a signature: someone who edits a
#   selection and its outline together and recomputes the digest gets past
#   this job. The weekly rebuild below, which fetches every port and opens a
#   pull request for whatever moved, is what catches that.
# - Weekly, it rebuilds every port to pick up OpenStreetMap's edits and opens
#   one pull request with what moved, like refresh.yml does for UN/LOCODE.
#   When an outline moved, the pull request also bumps the patch version and
#   adds a changelog entry naming each port that moved, so merging it
#   publishes the gem (release.yml). A release merged into main while this
#   runs, or while its pull request waits, makes that bump stale: this run's
#   last step and restack.yml then run it again on the new main. A
#   port that could not be built keeps its old outline and fails the run, so
#   a deleted feature or a failed download is not a quiet green tick. This
#   job reads Geofabrik's daily extracts with osmium-tool (OSM_SOURCE=extract)
#   rather than asking Overpass: every port at once is what Overpass's
#   rate limits refuse, and an extract gives the same answer to a rerun.
#   The pull request job stays on Overpass: it builds a port or two, and a
#   new port has no outline yet to choose its Geofabrik region by.
on:
  pull_request:
    paths:
      - "data/geometry/**"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

# Two quick pushes to one branch would race to push the rebuilt outlines.
concurrency:
  group: geometry-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A fork's branch cannot be pushed to with this token; its outlines are
    # built when a maintainer moves it onto a branch here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A port's build is capped at 20 minutes below; this caps a run where
    # Overpass is down for every port.
    timeout-minutes: 120
    # Branch names reach the shell only through these variables, quoted: git
    # allows $( ) ; | in a ref name, and this job can push.
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          fetch-depth: 0
      # GEOS cuts port limits with clip: water down to the water
      # (Geometry::Clip), through the rgeo gem's C extension. Build time only,
      # and installed before bundler builds rgeo, which otherwise installs
      # without GEOS support and says nothing.
      - name: Install GEOS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgeos-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          # Gems built against GEOS never share a cache with ones that were not.
          cache-version: geos
      - name: rgeo was built with GEOS
        run: |
          bundle exec ruby -e 'require "rgeo"; abort "rgeo has no GEOS (CAPI) support" unless RGeo::Geos.capi_supported?; puts "GEOS #{RGeo::Geos.version}"'

      - name: Build the outlines a pull request touches
        id: touched
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- data/geometry/sources data/geometry)
          # Only names shaped like a locode reach rake: a file called
          # "x];sh" must not become a task argument.
          locodes=$(printf '%s\n' "$changed" | sed -nE 's#^data/geometry/(sources/)?([A-Z]{2}[A-Z0-9]{3})\.(yml|geojson)$#\2#p' | sort -u)
          # Canals the same way, by their lower-case id (suez), from
          # data/geometry/canals.
          canals=$(printf '%s\n' "$changed" | sed -nE 's#^data/geometry/canals/(sources/)?([a-z][a-z0-9_]{1,30})\.(yml|geojson)$#\2#p' | sort -u)
          failed=""
          for locode in $locodes $canals; do
            case "$locode" in
              [A-Z]*) dir="data/geometry" ;;
              *) dir="data/geometry/canals" ;;
            esac
            if [ ! -f "$dir/sources/$locode.yml" ]; then
              rm -f "$dir/$locode.geojson"
              continue
            fi
            # An outline edited without its selection is rebuilt whatever its
            # digest says.
            if grep -qxF "$dir/sources/$locode.yml" <<<"$changed" && bundle exec rake "seaports:geometry_current[$locode]"; then
              continue
            fi
            # Overpass's client tries both instances three times, up to about
            # 17 minutes; -k kills a build that ignores the TERM.
            if ! timeout -k 30 1200 bundle exec rake "seaports:geometry[$locode]"; then
              failed="$failed $locode"
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit the regenerated outlines
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain data/geometry)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/geometry
            git commit -m "chore(data): build the port outlines from their selections"
            git push origin "HEAD:refs/heads/$HEAD_REF"
            # A push with GITHUB_TOKEN starts no workflow, so ask for CI.
            gh workflow run ci.yml --ref "$HEAD_REF"
          fi

      # After the commit, so the ports that did build reach the branch even
      # when another did not.
      - name: Check the outlines
        if: github.event_name == 'pull_request'
        env:
          FAILED: ${{ steps.touched.outputs.failed }}
        run: |
          set -euo pipefail
          status=0
          bundle exec rake seaports:check_geometry || status=$?
          if [ -n "${FAILED// /}" ]; then
            echo "::error::Not built from OpenStreetMap:$FAILED. The 'Build the outlines a pull request touches' step's log says why."
            status=1
          fi
          exit "$status"

      - name: Install osmium-tool
        if: github.event_name != 'pull_request'
        run: sudo apt-get install -y --no-install-recommends osmium-tool

      # Geofabrik publishes each region once a day, so a rerun the same day
      # reads the extracts the first run downloaded, and gives the same
      # outlines. Nothing older is restored: the build would download it
      # again anyway (Extract::MAX_AGE_DAYS). Saved by its own step below,
      # since the run that most needs a rerun is one that failed, and
      # actions/cache saves only after a success.
      - name: Date the extracts
        id: date
        if: github.event_name != 'pull_request'
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the day's extracts
        id: extracts
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: tmp/osm
          key: osm-extracts-${{ steps.date.outputs.today }}

      # A port that fails keeps its old file; the others still reach the
      # pull request, and the last step fails the run for the ones that did
      # not build.
      - name: Rebuild every outline
        id: rebuild
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OSM_SOURCE: extract
        run: bundle exec rake seaports:geometry

      - name: Keep the day's extracts for a rerun
        if: always() && github.event_name != 'pull_request' && steps.extracts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/osm
          key: osm-extracts-${{ steps.date.outputs.today }}

      # A release, like refresh.yml's: when an outline moved, the patch
      # version after the one this run checked out of main goes into
      # version.rb and Gemfile.lock, with a changelog entry naming each port
      # that moved, so merging the pull request publishes the outlines.
      - name: Decide the release
        id: release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          bundle exec rake seaports:geometry_release
          echo "status=$(cat tmp/geometry_refresh/status)" >> "$GITHUB_OUTPUT"
          if [ -f tmp/geometry_refresh/version ]; then
            echo "version=$(cat tmp/geometry_refresh/version)" >> "$GITHUB_OUTPUT"
          fi

      # An earlier week's pull request that is still open holds outlines this
      # run no longer produces. Closing it risks losing a review in progress,
      # so it gets a comment instead. Not after a failed rebuild: a port that
      # did not build kept its old outline, which says nothing about the
      # earlier pull request. Once per staleness: not again while no commit
      # has reached the branch since the last such comment.
      - name: Mark an earlier refresh pull request stale
        if: github.event_name != 'pull_request' && steps.release.outputs.status == 'unchanged' && steps.rebuild.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head refresh/geometry --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            exit 0
          fi
          # ISO 8601 times in UTC compare as strings. $pushed is jq's.
          # shellcheck disable=SC2016
          said=$(gh pr view "$pr" --json comments,commits --jq '
            ([.commits[].committedDate] | max) as $pushed
            | [.comments[] | select(.body | startswith("Stale:")) | .createdAt | select(. > $pushed)] | length')
          if [ "$said" = "0" ]; then
            gh pr comment "$pr" --body "Stale: this week's rebuild on $(date -u +%Y-%m-%d) moved no outline against main, so this branch no longer matches what OpenStreetMap gives. Close it, or wait for the next run to update it."
          fi

      - name: Open what moved for review
        id: pull_request
        if: github.event_name != 'pull_request' && steps.release.outputs.status == 'ok'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/geometry
          base: main
          commit-message: "chore(data): refresh the port outlines from OpenStreetMap"
          title: Refresh the port outlines from OpenStreetMap (${{ steps.release.outputs.version }})
          body-path: tmp/geometry_refresh/summary.md
          labels: data-refresh
          reviewers: edouard
          add-paths: |
            data/geometry/*.geojson
            data/geometry/canals/*.geojson
            lib/seaports/version.rb
            Gemfile.lock
            CHANGELOG.md

      - name: Run CI on the refresh
        if: steps.pull_request.outputs.pull-request-operation == 'created' || steps.pull_request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref refresh/geometry

      - name: Fail for the ports that did not build
        if: steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::Some port outlines could not be rebuilt and kept their old shapes. The 'Rebuild every outline' step's log says which and why."
          exit 1

      # The bump above was made from main as this run checked it out. A
      # release merged while it built (the UN/LOCODE refresh, opened at 06:17,
      # merged at 07:00) makes it stale: the pull request then conflicts on
      # version.rb and the changelog, which GitHub will not merge. So run
      # again on the new main, which bumps from the version just released.
      # restack.yml does the same for a release merged after this run ends.
      - name: Run again if main released while this ran
        # Last, and whatever failed above: the new run cancels this one
        # (concurrency), and this run has said all it had to.
        if: always() && (steps.pull_request.outputs.pull-request-operation == 'created' || steps.pull_request.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED_AT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git diff --quiet "$STARTED_AT" origin/main -- lib/seaports/version.rb; then
            echo "::notice::main released a new version while this ran; rebuilding on it so the bump follows it."
            gh workflow run geometry.yml --ref main
          fi
