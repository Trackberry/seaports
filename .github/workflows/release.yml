name: Release

# Publishing is triggered by the version file changing on main, which only a
# merged pull request can do. There is no manual push path and no API key: the
# gem is signed for by RubyGems trusted publishing, which trusts this workflow
# in this repository and nothing else.
on:
  push:
    branches: [main]
    paths:
      - "lib/seaports/version.rb"
  # The first release has no version bump to ride in on, and a release that
  # failed on something unrelated should not need a fake one either.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v5
      # GEOS for the clip: water tests, as in ci.yml: before bundler builds
      # rgeo, which otherwise installs without GEOS and says nothing.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgeos-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          # Gems built against GEOS never share a cache with ones that were not.
          cache-version: geos
      - name: rgeo was built with GEOS
        run: |
          bundle exec ruby -e 'require "rgeo"; abort "rgeo has no GEOS (CAPI) support" unless RGeo::Geos.capi_supported?; puts "GEOS #{RGeo::Geos.version}"'

      # The suite runs again here rather than trusting the pull request's run,
      # because what ships is this commit, not the one that was reviewed.
      - run: bundle exec rake

      - name: Read the version being released
        id: version
        run: echo "value=$(ruby -Ilib -rseaports/version -e 'print Seaports::VERSION')" >> "$GITHUB_OUTPUT"

      # Not only a version already published: one below the newest too. Two
      # release pull requests bumped from the same version, one merged and the
      # other's conflict resolved by hand, can leave main at 1.7.7 after 1.8.0
      # shipped. Versions compare as Gem::Version, so 1.7.10 is after 1.7.9.
      - name: Stop unless this version is newer than every published one
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          curl -fsS https://rubygems.org/api/v1/versions/seaports.json -o "$RUNNER_TEMP/published.json"
          ruby -rjson -e '
            version = Gem::Version.new(ENV.fetch("VERSION"))
            published = JSON.parse(File.read(File.join(ENV.fetch("RUNNER_TEMP"), "published.json"))).map { |row| Gem::Version.new(row.fetch("number")) }
            newest = published.max
            abort "seaports #{version} is already on RubyGems." if published.include?(version)
            abort "seaports #{version} is not newer than #{newest}, the newest on RubyGems: bump version.rb past it." if newest && version <= newest
            puts "seaports #{version} follows #{newest || "nothing published"}."
          '

      - uses: rubygems/release-gem@v1

      # The notes are the changelog entry the refresh wrote, so the release
      # page and the changelog cannot drift apart.
      - name: Tag the release and write its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          notes=$(ruby -e '
            changelog = File.read("CHANGELOG.md")
            print changelog[/^## #{Regexp.escape(ENV.fetch("VERSION"))}.*?(?=\n## |\z)/m].to_s.strip
          ')
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "${notes}"
