name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The refresh job starts it on its own pull request: one opened with
  # GITHUB_TOKEN does not trigger pull_request workflows, but a dispatch on
  # the branch reports its checks on the same commit.
  workflow_dispatch:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Non-EOL Rubies only; 3.3 is the oldest still maintained.
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v5
      # For the clip: water tests: GEOS, which the rgeo gem's C extension
      # links against. It must be here before bundler builds rgeo, which
      # otherwise installs without GEOS support and says nothing. Only the
      # outline builder uses it; the gem itself does not.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgeos-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Gems built against GEOS never share a cache with ones that were not.
          cache-version: geos
      - name: rgeo was built with GEOS
        run: |
          bundle exec ruby -e 'require "rgeo"; abort "rgeo has no GEOS (CAPI) support" unless RGeo::Geos.capi_supported?; puts "GEOS #{RGeo::Geos.version}"'
      - run: bundle exec rake
