name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The refresh job starts it on its own pull request: one opened with
  # GITHUB_TOKEN does not trigger pull_request workflows, but a dispatch on
  # the branch reports its checks on the same commit.
  workflow_dispatch:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Non-EOL Rubies only; 3.3 is the oldest still maintained.
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
