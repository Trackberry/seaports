  note: >-
    Seamark anchorage off Brunsbüttel, west of the canal entrance. The Bekanntmachung zur Seeschifffahrtsstraßen-Ordnung
    (BAnz AT 31.01.2014 B7, No. 17.2.4) lets only ships due to lock into the next free lock use it. OpenStreetMap
