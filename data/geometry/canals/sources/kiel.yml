canal: kiel
name: Kiel Canal
reviewed_at: '2026-11-24'
note: >-
  Drafted with osmium from Geofabrik's Schleswig-Holstein extract: every seamark anchorage and pilot boarding
  place in the Elbe from Neufeld to Wischhafen and in the Kiel Fjord, and the ways of the Nord-Ostsee-Kanal
  waterway relation. The canal runs west to east, from the Elbe at Brunsbüttel to the Kiel Fjord at Kiel-Holtenau,
  so its ends are west and east. Only the roadsteads the Bekanntmachung zur Seeschifffahrtsstraßen-Ordnung
  (BAnz AT 31.01.2014 B7, No. 17) keeps for ships bound for the locks are kept: the Nordwestreede von
  Brunsbüttel (17.2.4) and the Holtenau-Reede (17.3.1). Left out: the Südreede von Brunsbüttel, for ships
  of up to 120 m (17.2.5); the Nordostreede von Brunsbüttel, for one tide off the Elbehafen quay (17.2.6);
  the Neufeld-Reede Ost and West and the Wischhafen-Reede, Elbe roadsteads for waiting, bunkering and
  dangerous goods that the Bekanntmachung does not tie to the canal (17.2.10). OpenStreetMap maps no sidings
  (Weichen) inside the canal as areas and no pilot boarding place at Brunsbüttel.
ends:
  east: Kiel-Holtenau
  west: Brunsbüttel
