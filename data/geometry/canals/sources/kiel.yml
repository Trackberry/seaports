    entrance, so the area is that line grown by 300 m.
- osm: way/140480375
  kind: anchorage
  name: Anchorage
  approach: east
  note: >-
    Seamark anchorage with no name in OpenStreetMap, in the Kiel Fjord off the Holtenau locks: the Holtenau-Reede.
    The Bekanntmachung zur Seeschifffahrtsstraßen-Ordnung (BAnz AT 31.01.2014 B7, No. 17.3.1) keeps it
    for ships waiting to lock, for a berth in the port of Kiel or for better weather. The gem has no outline
    for the port of Kiel; limits for it that take in the roadstead would have to give it up.
