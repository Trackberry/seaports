canal: suez
name: Suez Canal
reviewed_at: '2026-11-23'
note: >-
  Drafted with osmium from Geofabrik's Egypt extract: every seamark anchorage and pilot boarding place
  between Port Said and Suez Bay, and the ways of the Suez Canal waterway relation. Two Suez Bay areas
  both named C1 lie off Adabiya harbour, west of the rest, and are left out as more likely Adabiya's than
  the canal's. The other Suez Bay areas are kept, though OpenStreetMap does not say which serve the canal
  and which serve the ports of Suez and Adabiya.
ends:
  north: Port Said
  south: Suez
