---
canal: suez
name: Suez Canal
reviewed_at: '2026-11-23'
note: >-
  Drafted with osmium from Geofabrik's Egypt extract: every seamark anchorage and pilot boarding place
  between Port Said and Suez Bay, and the ways of the Suez Canal waterway relation. In Suez Bay only the
  waiting areas for the northbound convoy are kept, following the Suez Canal Authority's Rules of Navigation
  (Art. 9, Suez), which give incoming ships two areas: the V berths, V1 to V9, and the East Waiting Area,
  whose berths OpenStreetMap numbers 1 to 29. Left out: the West Waiting Area, W1 to W14, which the rules
  do not give to the convoy; and the lettered areas north of both waiting areas, nearer Port Tawfiq and
  Adabiya (the A, B, C, D and H series and two areas named C1), which are in neither. OpenStreetMap tags
  none of them with a category, so the split is by the names and by which of the rules' buoyed limits
  each area lies in.
ends:
  north: Port Said
  south: Suez
