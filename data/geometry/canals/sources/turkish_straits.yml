  note: >-
    No OpenStreetMap waterway runs through the straits, and İstanbul Boğazı (relation 8926171) and Çanakkale
    Boğazı (relation 8926172) are areas bounded by the coastline, so the waterway is drawn from the traffic
    separation schemes' seamarks. In the Istanbul Strait, the scheme's separation line (way 1034443808),
    from off İnciburnu Feneri at the Marmara end to between Rumeli Burnu and Anadolu Feneri at the Black
    Sea end. In the Çanakkale Strait, the scheme's separation zone (way 964569473), drawn as its outline,
    which OpenStreetMap maps only from off Gelibolu Feneri south to off Çoraklık Burnu: the narrows at
    Çanakkale and the stretch down to the Aegean entrance have no scheme mapped, and no line crosses the
    Sea of Marmara. Use it to draw the straits, not to ask whether a ship is in them.
