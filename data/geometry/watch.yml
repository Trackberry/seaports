# The ports drafted and held, or skipped, because OpenStreetMap did not map
# their terminals. Weekly, .github/workflows/watch.yml runs
# `rake seaports:watch`, which asks OpenStreetMap for the named areas within
# radius_km of each port's UN/LOCODE position (or of the locode named by
# around, when the terminals are elsewhere) that could be a terminal, and
# opens an issue labelled port-watch when one appears that nobody has looked
# at. Nothing here is a coordinate, and nothing the watch finds becomes an
# outline by itself: draft the port with rake seaports:geometry_candidates.
#
# known: the features already looked at when the port was held, which are not
# enough for an outline (a port area with no terminals in it, a terminal of
# another port). Features an earlier port-watch issue named count as looked at
# too, open or closed, so this list only needs the ones from before the watch.
#
# Take a port out once it is outlined: the watch skips it and says so.
ports:
  - locode: KRPUS
    name: Busan
    around: KRBNP
    radius_km: 12
    reason: "OpenStreetMap maps only two of Busan New Port's container terminals as areas (Dongwon Global Terminal and a small EUNSAN yard), too few to outline the port."
    unblock: "The rest of the New Port container terminals mapped as named areas."
    known:
      way/712587486: "EUNSAN Container Terminals"
      way/864163962: "Dongwon Global Terminal"
  - locode: JPYOK
    name: Yokohama
    radius_km: 10
    reason: "OpenStreetMap maps none of Yokohama's container terminals as areas; the one container terminal within the radius is Kawasaki's Higashi-Ogishima."
    unblock: "Yokohama's container terminals (Honmoku, Minami-Honmoku, Daikoku) mapped as named areas."
    known:
      relation/15635176: "東扇島 Terminal"
      way/158475244: "横浜市港北土木事務所"
  - locode: JPNGO
    name: Nagoya
    radius_km: 15
    reason: "OpenStreetMap maps one of Nagoya's container terminals as an area (Nabeta Pier), not the others."
    unblock: "The other container terminals (Tobishima, Kinjo) mapped as named areas."
    known:
      way/194877256: "ブラザー工業 港工場"
      way/402396106: "港北ポンプ所"
      way/552566750: "Nabeta Pier Container Terminal"
      way/704074531: "Toyota Tobishima Wharf Center"
      way/758854036: "ピア納屋橋"
  - locode: CNQDG
    name: Qingdao
    radius_km: 15
    reason: "OpenStreetMap maps Qianwan as one port area of some 80 km² (QQCT, relation 6827312), not its container terminals one by one."
    unblock: "Qingdao's container terminals (Qianwan, Qianwan's automated terminal) mapped as named areas."
    known:
      relation/6827312: "Port of Qingdao Qianwan（QQCT）"
      way/1145936639: "青岛港"
      way/1258530251: "香港工业园(东京路)"
      way/1378191242: "港口机械厂"
      way/1378191253: "远港公司"
      way/1457959687: "青岛临港木业有限公司"
      way/1512617613: "邮轮母港停车场"
      way/1524284182: "中苑旅游码头"
      way/979347630: "普洛斯青岛前湾港国际物流园"
  - locode: CNTXG
    name: Tianjin
    radius_km: 15
    reason: "OpenStreetMap maps the Port of Tianjin and its Nanjiang zone as whole port areas, not its container terminals."
    unblock: "Tianjin's container terminals mapped as named areas inside the port."
    known:
      way/1084070326: "天津新港船舶重工有限责任公司"
      way/1089370626: "Huaneng Lingang Gas Thermal Power Plant"
      way/136739388: "南疆港区"
      way/1424329599: "万纬天津东疆港冷链园区"
