note: >-
  Drafted from rake seaports:geometry_candidates[ESSCT,10] and a search of named features along the waterfront,
  repeated on 2026-11-23. OpenStreetMap maps the harbour's quays as landuse=harbour areas, among them
  the Muelle de Contenedores in the Dársena del Este, the Muelle de Enlace and the Muelle de Ribera, which
  are used below. The Fred. Olsen and Naviera Armas berths are mapped only as nodes, so they are named
  in the quays' notes rather than as features. The Baleária cargo depot on the Muelle de Enlace (way/1318816052)
  is left out as part of that quay, and so is the cruise terminal building (way/264287946), which stands
  on the Muelle de Ribera and is tagged disused:building=public. The refinery's oil harbour at La Hondura
  (relation/2609785), 5 km south-west, is left out too: the hull from it to the Dársena del Este runs
  across the city centre. OpenStreetMap maps no anchorage off Santa Cruz.
port_limits:
