note: >-
  Drafted from a search of named features and seamarks around Belfast Lough. OpenStreetMap maps the Victoria
  Terminals on the east bank as one area named Belfast Harbour, with Belfast Container Terminal and the
  Stena Line terminals as small buildings inside it, so the terminal below is that area. The west-bank
  quays (York Dock, Barnett Dock, Albert and Ballast Quays, Sinclair and Gotto wharves) carry no cargo
  type in OpenStreetMap and go into the port limits only. The Cloghan Point oil terminal, 15 km down the
  lough, is left out so the limits do not cover the lough. OpenStreetMap maps no anchorage in Belfast
  Lough.
position_outside: >-
