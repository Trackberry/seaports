---
locode: CNXMG
reviewed_at: '2026-11-23'
note: >-
  Xiamen. Bills of lading name it CNXMN, which is not a port entry in UN/LOCODE; Xiamen Pt (CNXMG) is,
  and Xiamen (CNXAM) and Haicang (CNXMH) are listed as its quays. Drafted from a search of Geofabrik's
  Fujian extract. Only Haicang, the container port on the mainland side of the western harbour, is here.
  OpenStreetMap maps four container terminals there, all tagged cargo=container, but names only one, 远海码头
  (Xiamen Ocean Gate); it names no operator for any. The Dongdu terminals on Xiamen island are not here:
  OpenStreetMap maps only a harbour area there (厦门港), not the terminals themselves. Zhangzhou port, across
  the bay, is a different port.
quays:
- CNXAM
- CNXMH
position_outside: >-
  UN/LOCODE places Xiamen Pt at (24.35, 118.2), in open water south-east of Xiamen island, about 20 km
  from the Haicang terminals.
port_limits:
  derive: hull
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Xiamen. These are the hull of the Haicang terminals below, grown
    by 300 m and cut to the sea OpenStreetMap maps inside it, with the terminals kept whole: the terminals
    and the water off the Haicang waterfront, not the anchorages in the outer harbour. A search of OpenStreetMap
    found no housing, school, hospital, place of worship or named place inside them.
