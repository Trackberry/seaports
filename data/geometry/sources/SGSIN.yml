locode: SGSIN
reviewed_at: '2026-11-23'
note: >-
  Drafted from a search of Geofabrik's Malaysia, Singapore and Brunei extract along Singapore's south-west
  coast and a seamark search of the Singapore Strait. The outline covers the two container terminals PSA
  Singapore runs in the west, Tuas Port and Pasir Panjang, where Singapore's container traffic is consolidating.
  PSA's city terminals at Keppel and Brani are left out: they are due to move to Tuas by the end of 2027,
  and taking them in would stretch the limits over Sentosa and the city waterfront. Tanjong Pagar no longer
  handles containers. Jurong Port (SGJUR), the bulk and general cargo port run by Jurong Port Pte Ltd,
  and the oil terminals on Jurong Island are left out too: they have their own locodes and are not where
  Singapore's containers are handled. The anchorages are the Port of Singapore's seamark areas in the
  western and eastern sectors where cargo ships wait, hold and take on bunkers or stores; small-craft,
  explosives, laid-up and naval anchorages are left out.
quays:
- SGPPT
- SGTUA
- SGPAP
position_outside: >-
  UN/LOCODE places Singapore at 1.2833, 103.85, on the city centre at Raffles Place, about 7 km east of
  Pasir Panjang, the easternmost terminal mapped here. A ship there is off the city, not at a terminal.
port_limits:
  derive: hull
  buffer_m: 200
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Singapore. These are the hull of Tuas Port and Pasir Panjang
    Container Terminal, grown by 200 m and cut to the sea OpenStreetMap maps inside it, with the terminals
    kept whole: the terminals and the water between them, round Jurong Island and south of it, not the
    anchorages further out in the Strait. Jurong Island, the Tuas industrial estate and the Pasir Panjang
    shore are land and left out. A scan of OpenStreetMap finds no homes, residential land, schools, hospitals
    or places of worship inside. Sultan Shoal, a lighthouse islet, is inside, and the shore edge of Jurong
    Island reaches in by about 8 ha. The named places are the labels of Tuas View Extension, in a basin
    of Tuas Port, and of the Western Islands, in the water, a "Port" label on Pasir Panjang Terminal,
    and the planning-area outlines of Tuas and the Western Islands.
  accepts:
    places:
    - Port
    - Tuas View Extension
    - Western Islands
