note: >-
  Drafted from a search of Geofabrik's Hong Kong extract around Kwai Chung, Tsing Yi and Stonecutters
  Island. OpenStreetMap maps the Kwai Tsing container port as one area, not terminal by terminal, so Container
  Terminals 1 to 9 are a single feature here. The River Trade Terminal at Tuen Mun, 15 km west of Kwai
  Tsing, is here too; the oil terminals on the west side of Tsing Yi are not. The anchorages are the harbour's
  main cargo-ship ones.
quays:
- HKHKC
position_outside: >-
  UN/LOCODE places Hong Kong at (22.3167, 114.1667), in Kowloon, about 3 km east of the Kwai Tsing container
  terminals.
port_limits:
  derive: hull
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Hong Kong. These are the hull of the terminals below, from Kwai
    Tsing to the River Trade Terminal, grown by 300 m and cut to the sea OpenStreetMap maps inside it,
    with the terminals kept whole: the Kwai Tsing basin, the Rambler Channel, the channels round Tsing
    Yi and Ma Wan, and Urmston Road off Tuen Mun. Tsing Yi, Ma Wan and the Tsuen Wan and Tuen Mun shores
    are land and left out. A scan of OpenStreetMap finds no homes, schools, hospitals or places of worship
    inside. Eleven residential areas on the New Territories shore west of Tsuen Wan, Pearl Island Garden
    and Hong Kong Gold Coast among them, reach in where they are drawn over the water, by about 1,230
    m² in all, with 12 m² of an apartment block. The named places are Pillar Point, under the River Trade
    Terminal, the Tai Kok Tau headland on Tsing Yi's shore, lot outlines and a label on the terminals,
    some 40 rocks and islets in the channels, and slivers of Ma Wan's and Lantau's shores.
