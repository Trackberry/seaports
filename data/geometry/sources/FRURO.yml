note: >-
  Rouen's quays run about 15 km along the Seine, from the city basins to Grand-Couronne, and one outline
  around all of them takes in Petit-Quevilly, Grand-Quevilly and Petit-Couronne. Only the Grand-Couronne
  quays are mapped here: they hold the port's container terminal (TCMD), its bulk and liquid bulk berths,
  and are clear of the towns. Left out: the Petit-Couronne quays, where HAROPA lists the Groupe BZ and
  Simarex grain terminals (an outline reaching them also takes in Val-de-la-Haye across the river); the
  right-bank port at Croisset, Dieppedalle and Biessard, with the Socomac grain terminal; the Tepsa liquid
  bulk depots at Grand-Quevilly; and the city basins, with Sénalia's Rouen silos and the cruise berth.
  OpenStreetMap maps no grain terminal by name and no anchorage for Rouen.
position_outside: >-
  UN/LOCODE places Rouen on the city centre (49.45, 1.1), about 10 km upriver of the Grand-Couronne quays.
  A ship there is in the city, not at a terminal.
