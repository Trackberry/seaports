note: >-
  Drafted from a search of named features and seamarks over the Medway and Thames estuary. OpenStreetMap
  maps the Port of Sheerness as one area, with the fruit import terminal as a warehouse inside it, so
  the terminal below is the whole port. Thamesport and the Grain oil terminal across the Medway, Queenborough
  and Chatham Docks upstream are other ports and are left out. The N1 to N5 anchorages and Little Nore
  serve the Medway approach; OpenStreetMap gives none of them a category.
port_limits:
  derive: hull
  buffer_m: 800
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Sheerness; Peel Ports' Medway limits cover the whole river.
    These are the hull of the Port of Sheerness, grown by 800 m, then cut to the water OpenStreetMap maps
    inside it, with the terminals kept whole and a 30 m margin where they meet the water. A scan of OpenStreetMap
    finds no homes, schools, hospitals, places of worship or named places inside; the edges of three unnamed
    residential areas reach in by about 650 m² in all, none of it more than 5 m inside.
