note: >-
  Drafted from a search of Geofabrik's Vietnam extract around Hai Phong. OpenStreetMap maps the port's
  terminals thinly. This outline covers Lach Huyen, the deep-water terminals on Cat Hai island at the
  mouth of the Lach Huyen channel, where the largest ships calling at Hai Phong berth, and Dinh Vu port
  at the tip of the Dinh Vu peninsula 14 km west. The Nam Dinh Vu, Tan Vu, VIP Greenport and other peninsula
  terminals are not mapped as terminals, so they are not listed, and the older river terminals in the
  city, Hoang Dieu, Chua Ve, Doan Xa, Nam Hai and Vicoship, are not here either. OpenStreetMap maps no
  anchorage and no pilot boarding place for Hai Phong.
position_outside: >-
  UN/LOCODE places Hai Phong at 20.85, 106.6833, on the city centre by the old Hoang Dieu port, about
  9 km west of Dinh Vu. A ship there is at a city river berth, not at Dinh Vu or Lach Huyen.
