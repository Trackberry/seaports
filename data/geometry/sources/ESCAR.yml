note: >-
  Drafted from a search of named features around Cartagena and the Escombreras valley. OpenStreetMap maps
  the town harbour's container and general-cargo terminals and the cruise quay. It maps nothing at Escombreras
  as an area: the harbour is a node, and the Alkion tank terminal (way/99702319) is a building too small
  to pass, so the Escombreras liquid and bulk terminals (Repsol, Enagás, Alkion and the rest) are left
  out until they are mapped. OpenStreetMap maps no anchorage off Cartagena, so none is listed.
position_outside: >-
  UN/LOCODE places Cartagena at (37.6, -0.9833), in the old town about 500 m north of the cruise quay,
  just beyond these limits. A ship there is not at a terminal.
port_limits:
