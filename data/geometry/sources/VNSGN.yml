locode: VNSGN
reviewed_at: '2026-11-23'
note: >-
  Drafted from a search of Geofabrik's Vietnam extract along the Saigon and Dong Nai rivers. The outline
  covers the Cat Lai cluster on the Dong Nai river in Thu Duc, where most of Ho Chi Minh City's containers
  are handled, and the older river ports on the Saigon river in Districts 4 and 7, about 6 km upriver:
  Vietnam International Container Terminals, Tan Thuan, Ben Nghe, Lotus and the Khanh Hoi wharves of Saigon
  Port, named here as OpenStreetMap names them. The deep-water terminals at Cai Mep, 60 km away, are a
  separate port (VNCMT). OpenStreetMap maps no anchorage or pilot boarding place on these rivers.
quays:
- VNCLI
position_outside: >-
  UN/LOCODE places Ho Chi Minh City at 10.7667, 106.6667, in the city's western districts, about 5 km
  west of the Khanh Hoi wharves and well inland of every quay. A ship cannot be there.
port_limits:
  derive: hull
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Ho Chi Minh City. These are the hull of the terminals below,
    grown by 300 m and cut to the rivers OpenStreetMap maps inside it, with the terminals kept whole:
    the Saigon river from Khanh Hoi round Thu Thiem to its meeting with the Dong Nai, the Dong Nai past
    Cat Lai, and the creeks that open off them. Thu Thiem, Cat Lai town and the city are land and left
    out. A scan of OpenStreetMap finds no homes, schools, hospitals or places of worship inside. Seven
    residential areas on the banks reach in where they are drawn over the river, by about 2 ha in all,
    most of it a strip of Khu đô thị Sala in Thu Thiem, none of it more than 40 m inside, and an island's
    shore by 320 m²; the only named place is a Khu phố 26 neighbourhood label on the river bank.
  accepts:
    residential_m2: 20788
    places:
    - Khu phố 26
