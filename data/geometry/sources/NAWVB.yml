    OpenStreetMap maps no port limits for Walvis Bay. These are the hull of the container terminal and
    the multipurpose berths grown by 300 m, cut to the water OpenStreetMap maps inside it, with the terminals
    kept whole and a 30 m margin where they meet the water. What is left is the two terminals and the
    harbour basin off them. A Mission to Seafarers chapel stands inside the port area, and the shore edge
    of an unnamed residential area reaches in by under 100 m². A scan of OpenStreetMap finds no other
    homes, schools, hospitals or named places inside.
