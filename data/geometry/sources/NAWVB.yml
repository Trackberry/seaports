note: >-
  Drafted from a search of the Geofabrik Namibia extract around the bay. OpenStreetMap maps the container
  terminal opened in 2019 on reclaimed land, and the original port behind it as one unnamed industrial
  area. The North Port liquid bulk terminal, about 6 km up the shore at the SADC Gateway site, is left
  out: no current source says it is in service, and taking it in would stretch the limits over the town's
  industrial areas. The fish quays and the Namdock shipyard are not listed as terminals. OpenStreetMap
  maps no anchorage for Walvis Bay.
