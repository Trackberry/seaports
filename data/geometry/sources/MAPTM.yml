note: >-
  Drafted from a search of a Geofabrik Morocco extract around Tanger Med. OpenStreetMap maps the four
  container terminals and the passenger and ro-ro port, and no anchorage or pilot boarding place near
  them. It does not map the hydrocarbon terminal or the vehicle terminal separately, so they are not listed.
  The logistics free zone behind Tanger Med 1 is left out: it is warehouses, not quays.
port_limits:
