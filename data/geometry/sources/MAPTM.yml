locode: MAPTM
reviewed_at: '2026-11-23'
note: >-
  Drafted from a search of a Geofabrik Morocco extract around Tanger Med. OpenStreetMap maps the four
  container terminals and the passenger and ro-ro port, and no anchorage or pilot boarding place near
  them. It does not map the hydrocarbon terminal or the vehicle terminal separately, so they are not listed.
  The logistics free zone behind Tanger Med 1 is left out: it is warehouses, not quays.
port_limits:
  derive: hull
  buffer_m: 200
  clip: water
  disjoint: >-
    Tanger Med 1 (TC1 and TC2) and Tanger Med 2 (TC3, TC4 and the passenger port) are separate basins,
    each inside its own breakwater, so the limits are in two parts.
  note: >-
    OpenStreetMap maps no port limits for Tanger Med. These are the hull of the terminals below, from
    TC4 in the west to TC2 in the east, grown by 200 m, then cut to the water OpenStreetMap maps inside
    it, with the terminals kept whole and a 30 m margin where they meet the water. A scan of OpenStreetMap
    finds no homes, residential land, schools, hospitals or named places inside; one place of worship,
    a prayer room mapped as a point, stands on the passenger port's land.
  accepts:
    amenities: 1
