---
locode: FRLEH
reviewed_at: '2026-11-23'
note: >-
  Drafted from rake seaports:geometry_candidates around Port 2000 and the Seine bay, and checked against
  HAROPA's 2026 container terminal catalogue. OpenStreetMap maps no anchorage in the Seine bay, so none
  is listed. The Seafrigo cold stores are mapped only as buildings, so no reefer store is here; reefer
  is marked on the container terminals that HAROPA lists with reefer plugs. The Terminal de Normandie
  mapped on the Bassin René Coty (way/163105116) is left out: HAROPA lists no container terminal there,
  and Terminaux de Normandie is now the name of the Port 2000 terminal below. The cruise terminal and
  Brittany Ferries' Terminal de la Citadelle are left out too: they stand on the city waterfront at Saint-François,
  and a hull reaching them would run across the homes and schools of Saint-Nicolas and L'Eure. For the
  same reason the CIM oil terminal (way/518702536) is left out: its 150 ha tank farm and six tanker berths
  on the south side of the Bassin Théophile Ducrocq are a real part of the port, but its western tip pulls
  the limits over Saint-Nicolas and L'Eure. Quays from Trackberry's config/port_areas.yml. The pilot boarding
  places are the three Le Havre ones, by draught.
quays:
- FRGLO
- FRHRF
position_outside: >-
  UN/LOCODE places Le Havre at (49.5, 0.1), in the town north of the old docks, beyond the Bassin Vauban
  and the Bassin du Commerce. A ship there is in the city, not at a terminal.
port_limits:
  derive: hull
  buffer_m: 250
  note: >-
    OpenStreetMap maps no port limits for Le Havre. These are the hull of the terminals below, from Port
    2000 and Terminal de l'Atlantique to the ro-ro terminals on the Darse de l'Océan, grown by 250 m.
    Les Neiges, a district of homes and a primary school enclosed by the docks between Terminal de l'Atlantique
    and Terminal de l'Europe, is inside. Beyond it the only addresses inside are a few premises on Rue
    Cuvier, by the municipal vehicle garage, and a container depot on the Route des Marais. Saint-François,
    Saint-Nicolas, L'Eure, Graville, Harfleur and Gonfreville-l'Orcher are outside.
  accepts:
    houses: 7
    residential_m2: 271254
    amenities: 1
    places:
    - Les Neiges
