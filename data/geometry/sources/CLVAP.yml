  is not listed. The bay's anchor positions are mapped as points, not areas, so no anchorage is listed.
position_outside: >-
  UN/LOCODE places Valparaíso at (-33.0333, -71.6333), on the hillside of Playa Ancha about 500 m west
  of Terminal 1. A ship there would be ashore.
port_limits:
