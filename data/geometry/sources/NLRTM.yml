position_outside: >-
  UN/LOCODE places Rotterdam on the city centre (51.9167, 4.5), about 4 km east of Waalhaven, the easternmost
  cargo quay mapped here. A ship there is in the city, not at a terminal.
port_limits:
  derive: hull
  buffer_m: 1500
  clip: water
  disjoint: >-
    Kloosterboer and Cool Port I are cold stores away from the water (see their inland), each mapped in
    pieces, and a piece of the Stena Line terminal at Hoek van Holland lies apart from the river's water,
    so each is a part of its own.
  note: >-
    OpenStreetMap maps no port limits for Rotterdam. These are the hull of the terminals below, from Maasvlakte
    to Waalhaven, grown by 1.5 km, then cut to the water OpenStreetMap maps inside it, with the terminals
    kept whole and a 30 m margin where they meet the water. A scan of OpenStreetMap finds no homes, schools,
    hospitals, places of worship or named places inside. The residential areas OpenStreetMap draws for
    the towns along the Nieuwe Waterweg and the Oude Maas, outlines of 1 to 6 km² each, reach out over
    the river by about 38 ha in all, none of it on land.
  accepts:
    residential_m2: 381595
