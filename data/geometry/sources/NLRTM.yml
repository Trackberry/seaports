reviewed_at: '2026-11-23'
note: >-
  Drafted from rake seaports:geometry_candidates around Maasvlakte and the city, and a name search for
  terminals tagged landuse=industrial only (Rotterdam World Gateway, the Waalhaven cold stores). Quays
  from Trackberry's config/port_areas.yml. OpenStreetMap gives no category for the Maasmond anchorages,
  so none is set.
