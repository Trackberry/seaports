  note: >-
    OpenStreetMap maps no port limits for Tilbury; the Port of London Authority's limits cover the whole
    tidal Thames. These are the hull of the Port of Tilbury and Tilbury2, grown by 800 m, then cut to
    the water OpenStreetMap maps inside it, with the terminals kept whole and a 30 m margin where they
    meet the water. A scan of OpenStreetMap finds no homes, schools, hospitals, places of worship or named
    places inside; the edges of three residential areas, Cable Wharf among them, reach in by about 370
    m² in all, none of it more than 5 m inside.
