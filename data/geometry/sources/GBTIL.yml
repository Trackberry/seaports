note: >-
  Drafted from a search of named features and seamarks along the Thames from Purfleet to the estuary.
  OpenStreetMap maps the Port of Tilbury as one area, not as Tilbury Container Services, the ro-ro berths,
  the grain terminal and the London Cruise Terminal inside it, so the terminal below is the whole port.
  London Gateway, 7 km downstream, is GBLGP and is left out; so are the Purfleet and Northfleet wharves
  upstream, which are not Forth Ports'. The anchorages are the Port of London Authority's in Gravesend
  and St Clements reaches; OpenStreetMap gives neither a category.
port_limits:
