note: >-
  Drafted from a search of a Geofabrik Nordeste extract around Pecém. OpenStreetMap maps the port's offshore
  berths (the multipurpose terminal and piers 1 and 2), the port area ashore, and four seamark anchorages.
  The wider Complexo Industrial e Portuário do Pecém, the export processing zone and the steel works inland
  are left out: they are industry, not quays. Píer 1 is left out too: OpenStreetMap gives no cargo type
  or operator for it.
