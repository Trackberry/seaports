locode: CNYSA
reviewed_at: '2026-11-23'
note: >-
  Yangshan, the deep-water container port of Shanghai on the Yangshan islands, 30 km offshore and joined
  to the mainland by the Donghai Bridge. Bills of lading name it as Shanghai (CNSHA, which UN/LOCODE files
  as an airport, not a port); it has its own outline here because it lies about 70 km from Waigaoqiao,
  the river port of Shanghai (CNSGH). Drafted from a search of Geofabrik's Zhejiang extract around the
  islands. OpenStreetMap maps Phases I to III as one area and Phase IV separately, two anchorages west
  and south-west of the port, and the oil and LNG terminals on Xiaoyangshan.
position_outside: UN/LOCODE places Yangshan at (30.5833, 122.0667), in open water about 3 km south of
  the port limits.
port_limits:
  derive: hull
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Yangshan. These are the hull of the terminals below, grown by
    300 m and cut to the sea OpenStreetMap maps inside it, with the terminals kept whole: the water along
    the south face of the islands, from Phase IV to the oil terminal. They do not reach the anchorages.
    A scan of OpenStreetMap finds no homes, residential land, schools, hospitals, places of worship or
    named places inside; the island outlines in them are Lesser Yangshan's and Dawugui's, under the terminals.
