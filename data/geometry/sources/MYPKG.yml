  note: >-
    OpenStreetMap maps no port limits for Port Klang. These are the hull of Westports and Northport, grown
    by 200 m and cut to the water OpenStreetMap maps inside it, with the terminals kept whole: the terminals
    and the Klang Strait between them, with the creeks that open off it. Pulau Indah, the mangrove islands
    in the strait and Port Klang town are land and left out. A scan of OpenStreetMap finds no homes, residential
    land, schools, hospitals, places of worship or named places inside; Pulau Indah's outline is under
    Westports, and parts of Pulau Klang's mangrove shore reach in by about 7 ha.
