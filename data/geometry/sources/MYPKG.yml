note: >-
  Drafted from a search of Geofabrik's Malaysia, Singapore and Brunei extract around Klang. OpenStreetMap
  maps Port Klang's three port areas: Westports on Pulau Indah, Northport on the north bank of the Klang
  estuary, and Southpoint, Northport's older conventional wharves in Port Klang town. Southpoint is left
  out: it handles general cargo and passengers rather than containers. The Port Klang Free Zone beside
  Westports is a distribution park, not a terminal, and is left out. OpenStreetMap maps no anchorage and
  no pilot boarding place off Port Klang.
