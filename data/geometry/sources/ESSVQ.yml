note: >-
  Sevilla is a river port, 80 km up the Guadalquivir, with its quays on the Canal de Alfonso XIII and
  the Dársena del Batán. Ships wait for the tide at the river mouth, off Bonanza and Chipiona, where OpenStreetMap
  maps no anchorage. Left out: the Sevitrade liquid bulk terminal at the Dársena del Cuarto and the Carbón
  Puerto (Euroports) dry bulk terminal on the left bank of the canal, which OpenStreetMap does not map
  as areas; the Muelle de Tablada, which it maps only as harbour land; the Batán logistics zones, Zona
  Franca and Stockauto Sur vehicle yard, which are not berths; and the shipyards.
