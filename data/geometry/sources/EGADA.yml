  kind: anchorage
  name: C1
  note: >-
    Seamark area off Adabiya, named C1 in OpenStreetMap, which gives it no category. It lies at the second
    position of the Adabeya Anchorage in the Suez Canal Authority's Rules of Navigation (Art. 9, Port
    of Suez).
- osm: way/208960300
  kind: anchorage
  name: C1
  note: >-
    Seamark area off Adabiya, named C1 in OpenStreetMap, which gives it no category. It lies at the first
    position of the Adabeya Anchorage in the Suez Canal Authority's Rules of Navigation (Art. 9, Port
    of Suez).
- osm: way/337053006
  kind: terminal
  name: ميناء الأدبية
  cargo:
  - bulk
  - general
  note: >-
    The port area, mapped as industrial land named ميناء الأدبية (Adabiya Port) in OpenStreetMap, which
    gives it no English name. SCZONE, which manages the port, lists eight berths, 1,465 m in all, for
    dry and liquid bulk, general and project cargo, containers and livestock, and names no single operator
    for them. OpenStreetMap's area, about 26 ha, is smaller than the 114 ha SCZONE gives for the port.
