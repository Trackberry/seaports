  note: >-
    OpenStreetMap maps no port limits for Manzanillo. These are the hull of Manzanillo International Terminal
    grown by 100 m, cut to the water OpenStreetMap maps inside it, with the terminal kept whole: the terminal
    and its berths on Manzanillo Bay. A scan of OpenStreetMap finds no homes, residential land, schools,
    hospitals, places of worship or named places inside.
