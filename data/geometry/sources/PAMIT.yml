locode: PAMIT
reviewed_at: '2026-11-24'
note: >-
  Drafted with osmium from Geofabrik's Panama extract around Limon Bay and Manzanillo Bay. Manzanillo
  International Terminal, on the Coco Solo peninsula east of the Atlantic entrance to the canal, has its
  own locode, PAMIT, which carriers use for it. Colón Container Terminal next door (PAONX) and Cristóbal
  across the bay (PACTB) are separate terminals with their own operators and locodes, so they are separate
  outlines, not quays of this one. The Limon Bay anchorages A, C and D are where ships wait for the canal;
  they belong to the Panama Canal's outline, and OpenStreetMap maps no anchorage of the port's own.
port_limits:
