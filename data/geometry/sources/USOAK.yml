note: >-
  Drafted from a search of Geofabrik's Northern California extract around the Oakland Outer and Middle
  Harbors. OpenStreetMap maps the port's berths under the names they had in the 2000s (Hanjin, APL, Ben
  E. Nutter, Transbay); each is matched here to the terminal the Port of Oakland lists on those berths
  today. The vacant Outer Harbor Terminal (berths 22 to 24) and Howard Terminal (berths 67 and 68) are
  left out. OpenStreetMap maps no anchorage in San Francisco Bay that serves Oakland, and no pilot boarding
  place.
port_limits:
  derive: hull
  buffer_m: 250
  note: >-
    OpenStreetMap maps no port limits for Oakland. These are the hull of the terminals below, from the
    Outer Harbor to the Middle Harbor, grown by 250 m. They take in the rail yards and logistics centre
    between the terminals and the Middle Harbor basin. A search of OpenStreetMap found no homes, residential
    land, schools, churches, hospitals or named places inside them: South Prescott Park and the houses
    of West Oakland are just outside.
