locode: CNSHK
reviewed_at: '2026-11-23'
note: >-
  Shekou, the western Shenzhen container port: Shekou, Chiwan and Mawan on the tip of the Nanshan peninsula.
  Bills of lading name it as Shekou (CNSHK), Chiwan (CNCWN) or Shenzhen (CNSZX, which is not a port entry
  in UN/LOCODE). Chiwan and Shenzhen Pt (CNSZP), whose UN/LOCODE position is at Mawan, are listed as quays.
  Eastern Shenzhen is Yantian (CNYTN), 40 km away. Drafted from a search of Geofabrik's Guangdong extract.
  Dachan Bay Container Terminal, 6 km north of Mawan, is here too.
quays:
- CNCWN
- CNSZP
position_outside: >-
  UN/LOCODE places Shekou at (22.4833, 113.9167), in Shekou town on the east side of the peninsula, about
  3 km from the port limits.
port_limits:
  derive: hull
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Shekou. These are the hull of the Shekou, Chiwan, Mawan, Haixing
    and Dachan Bay terminals, grown by 300 m and cut to the sea OpenStreetMap maps inside it, with the
    terminals kept whole: the terminals and the water off the west shore of the peninsula. Qianhai, the
    Mawan housing and Shekou town are land and left out. A search of OpenStreetMap found no housing, school,
    hospital, place of worship or named place inside them.
