  clip: water
  note: >-
    OpenStreetMap maps no port limits for Melbourne. These are the hull of the terminals below, from Swanson
    Dock to Webb Dock, grown by 300 m, then cut to the water OpenStreetMap maps inside it, with the terminals
    kept whole and a 30 m margin where they meet the water. What is left is the four terminals, Swanson
    Dock, the lower Yarra, Webb Dock and the water of Hobsons Bay between; Port Melbourne, Williamstown,
    Docklands and Coode Island are cut away. A scan of OpenStreetMap finds no homes, residential land,
    schools, hospitals, places of worship or named places inside.
