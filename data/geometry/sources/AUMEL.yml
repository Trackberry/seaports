note: >-
  Drafted from rake seaports:geometry_candidates around Swanson Dock and Webb Dock. Melbourne's container
  trade is at three terminals: Patrick and DP World either side of Swanson Dock on the Yarra, and Victoria
  International Container Terminal at Webb Dock East. Car carriers berth at Webb Dock West. The Newport
  and Yarraville fuel terminals and the Station Pier passenger berths are left out, as is the area OpenStreetMap
  names Webb Dock North, whose operator is not clear.
position_outside: >-
  UN/LOCODE places Melbourne on the city centre (-37.8167, 144.9667), about 4 km east of Swanson Dock.
  A ship cannot reach it.
port_limits:
