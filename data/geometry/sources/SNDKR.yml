    extension in the north, grown by 200 m, then cut to the water OpenStreetMap maps inside it, with the
    terminals and Mole 10 kept whole and a 30 m margin where they meet the water. What is left is the
    moles and the harbour basins between them; the Plateau, the Médina and Gorée are outside. A scan of
