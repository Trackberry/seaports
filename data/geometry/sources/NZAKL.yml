note: >-
  Drafted from rake seaports:geometry_candidates around the Waitematā waterfront. OpenStreetMap maps Fergusson
  Container Terminal on its own and the rest of the Port of Auckland as one area, with each berth as a
  point. The multi-cargo wharves west of Fergusson (Bledisloe, Jellicoe, Freyberg), where car carriers
  and break bulk berth, are not mapped as their own area, and the Port of Auckland area reaches the downtown
  ferry wharves and Britomart, so neither is used here: a car carrier at Bledisloe may fall outside these
  limits. The anchorages OpenStreetMap maps in the harbour are small-craft moorings and an explosives
  anchorage, so none is listed.
position_outside: >-
  UN/LOCODE places Auckland on the Waitematā Harbour (-36.8333, 174.8), about 1.1 km north-east of Fergusson
  Container Terminal. A ship there is in the harbour, not at the terminal.
