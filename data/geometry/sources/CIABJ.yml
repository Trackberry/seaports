locode: CIABJ
reviewed_at: '2026-11-23'
note: >-
  Drafted from a search of the Geofabrik Ivory Coast extract around the Ébrié lagoon harbour. OpenStreetMap
  maps the two container terminals at Vridi, the fruit quay and the port's general quays by their berth
  numbers. The fishing port, the timber port and the shipyards are left out. OpenStreetMap maps no anchorage
  for Abidjan, and the Vridi canal is the only way in.
position_outside: >-
  UN/LOCODE places Abidjan on Le Plateau, the business district on the lagoon (5.3333, -4.0167), about
  2 km north of the fruit quay, the northernmost cargo quay mapped here. A ship there is in the lagoon
  off the city, not at a terminal.
port_limits:
  derive: hull
  buffer_m: 200
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Abidjan. These are the hull of the terminals below, from the
    container terminals at Vridi to the fruit quay in the north, grown by 200 m, then cut to the water
    OpenStreetMap maps inside it, with the terminals kept whole and a 30 m margin where they meet the
    water. What is left is the lagoon water off the quays and the six terminals; the land of Treichville
    and Petit-Bassam between them is cut away. A scan of OpenStreetMap finds no homes, schools, hospitals
    or places of worship inside. Two residential areas reach in where they are drawn over the shore, by
    about 200 m² in all; the commune of Treichville and the island of Petit-Bassam, whose outlines take
    in the port, overlap it; and the named places inside are labels on the quays and the grain terminal.
  accepts:
    residential_m2: 215
