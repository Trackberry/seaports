note: >-
  Drafted with osmium from Geofabrik's Panama extract around the Pacific entrance to the canal. PSA Panama
  International Terminal is on the west bank of the entrance, on the former Rodman naval station, and
  carriers file it under PAROD, Rodman. Balboa (PABLB), across the channel, is a separate port with its
  own operator. The Pacific Anchorage, its expansion and the Hazardous Cargo Anchorage are where ships
  wait for the canal; they belong to the Panama Canal's outline, and OpenStreetMap maps no anchorage of
  the port's own.
