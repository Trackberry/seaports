  note: >-
    OpenStreetMap maps no port limits for Jebel Ali. These are the hull of the four terminals and the
    harbour basin between them, grown by 300 m and cut to the water OpenStreetMap maps inside it, with
    the terminals and the basin kept whole: the terminals, the dredged harbour basin round Terminal 1
    and the sea inside the breakwaters. The Jebel Ali Free Zone behind the quays is land and left out.
    A scan of OpenStreetMap finds no homes, residential land, schools, hospitals or places of worship
    inside; the named places are a Jebel Ali Port label in the basin and the outlines of Jabal Ali and
    the Jebel Ali North Free Zone, which take in the terminals.
