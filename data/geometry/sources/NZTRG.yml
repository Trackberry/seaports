    OpenStreetMap maps no port limits for Tauranga. These are the hull of the two sides of the port grown
    by 300 m, cut to the water OpenStreetMap maps inside it, with the terminals kept whole and a 30 m
    margin where they meet the water. What is left is the Mount Maunganui wharves, the Sulphur Point container
    terminal and Stella Passage between them; the town of Mount Maunganui between the wharves is cut away.
    A scan of OpenStreetMap finds no schools, hospitals or places of worship inside. Six houses stand
    inside the Mount Maunganui wharves' own outline and two more in the margin beside it, eight wholly
    inside in all, with the edge of a small residential area; the named places are the Sulphur Point label
    on the container terminal, and the boundaries of Mount Maunganui and its industrial quarter overlap
    the wharves.
