locode: DEHAM
reviewed_at: '2026-11-23'
note: >-
  Drafted from rake seaports:geometry_candidates around the city and off the Elbe and Weser mouths, and
  a name search for terminals tagged landuse=industrial only (O'Swaldkai, the HHLA fruit centre, Steinweg,
  Rosshafen). Quays from Trackberry's config/port_areas.yml. The anchorages are the Elbe's, at its mouth
  more than 100 km below the city: they serve Brunsbüttel, Cuxhaven and Stade too, not Hamburg alone.
  OpenStreetMap gives none of them a category, and maps no anchorage in the harbour itself.
quays:
- DEHHV
- DEHBU
- DEHTJ
- DEXFW
port_limits:
  derive: hull
  buffer_m: 1500
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Hamburg. These are the hull of the terminals below, from Eurogate
    and Altenwerder in the west to O'Swaldkai and the cruise centre in the east, grown by 1.5 km, then
    cut to the water OpenStreetMap maps inside it, with the terminals kept whole and a 30 m margin where
    they meet the water. A scan of OpenStreetMap finds no homes, schools or hospitals inside. The Flussschifferkirche,
    a church ship moored in the harbour, is inside; the labels of two HafenCity quarters, Am Sandtorkai
    and Baakenhafen, stand at the water's edge; and the edges of five residential areas, the Peutehafen
    one among them, reach in by about 500 m² in all, none of it more than 5 m inside.
  accepts:
    residential_m2: 499
    amenities: 1
    places:
    - Quartier Am Sandtorkai
    - Quartier Baakenhafen
