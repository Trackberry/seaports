---
locode: JPOSA
reviewed_at: '2026-11-23'
note: >-
  Drafted from a search of Geofabrik's Kansai extract around Nanko (Sakishima) and Yumeshima. OpenStreetMap
  maps Osaka's container berths one by one under the port's own berth codes: C-1 to C-4, C-8 and C-9 at
  Nanko, and C-10 to C-12 on Yumeshima. It gives no operator for any of them, and maps no anchorage in
  Osaka Bay. The multipurpose berths C-6 and C-7, the liner berths L-1 to L-7 and the R-1 to R-5 berths
  on the west side of Nanko are here too. The Nanko ferry terminal is not. Kobe (JPUKB) is 10 km west.
position_outside: UN/LOCODE places Osaka at (34.6667, 135.5), in the city centre, about 6 km east of the
  nearest quay.
port_limits:
  derive: hull
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Osaka. These are the hull of the berths below, from Yumeshima
    to Nanko, grown by 300 m and cut to the sea OpenStreetMap maps inside it, with the berths kept whole:
    the berths and the water off them. The land of Sakishima between the berths is left out, with Nanko
    Port Town and Cosmo Square, which has flats (River Garden) as well as offices. A scan of OpenStreetMap
    finds no homes, residential land, schools, hospitals or places of worship inside; the named places
    are the district (chōme) labels on the berths and the outlines of Yumeshima and Sakishima, under them.
  accepts:
    places:
    - 南港中七丁目
    - 南港中八丁目
    - 南港北三丁目
    - 南港東九丁目
    - 南港東六丁目
    - 夢洲東一丁目
