note: >-
  Drafted from a search of the Geofabrik Nigeria extract around the Lekki Free Trade Zone. Lekki Deep
  Sea Port has its own locode, NGLKK (Ibeju-Lekki), about 60 km east of Apapa and Tin Can Island. The
  Dangote refinery's jetty, 10 km further east, is a separate private facility and is left out. OpenStreetMap
  maps no anchorage for Lekki.
position_outside: >-
  UN/LOCODE places Ibeju-Lekki at (6.4333, 4.0), a rounded position a few tens of metres outside the north-west
  corner of these limits, on the free trade zone's land behind the port.
