  note: >-
    India's busiest container port, run by the Jawaharlal Nehru Port Authority. Its container terminals
    are Nhava Sheva Freeport Terminal, the authority's former Jawaharlal Nehru Port Container Terminal,
    conceded in July 2022 to JM Baxi and CMA Terminals and run under that name since February 2023, DP
    World's Nhava Sheva International Container Terminal and Nhava Sheva India Gateway Terminal, APM Terminals'
    Gateway Terminals India, and PSA's Bharat Mumbai Container Terminals. OpenStreetMap maps none of them
    separately, so this area is the whole port, liquid cargo berths included.
