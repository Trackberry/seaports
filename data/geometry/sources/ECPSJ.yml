note: >-
  Drafted from a search of a Geofabrik Ecuador extract around Posorja. OpenStreetMap maps the DP World
  terminal, and no anchorage or pilot boarding place. The tuna canneries' quays south of it (Salica, NIRSA)
  are tagged industrial=port too, but are fishing quays across the town from the terminal, and are left
  out so that the limits do not take in Posorja town.
position_outside: >-
  UN/LOCODE places Posorja on the town (-2.7, -80.25), about 1 km south of the terminal. A ship there
  would be ashore.
port_limits:
