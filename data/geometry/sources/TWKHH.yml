locode: TWKHH
reviewed_at: '2026-11-23'
note: >-
  Drafted from a search of Geofabrik's Taiwan extract around Kaohsiung harbour. OpenStreetMap maps the
  container centres one by one under Taiwan International Ports Corporation's numbering, without operators:
  each centre is leased to several carriers, so no operator is set. It maps the four numbered anchorages
  and the dangerous goods anchorage off the harbour, from the Taiwan navy's notice. The pilot boarding
  area is mapped as an area, not a point, so it is not here.
position_outside: UN/LOCODE places Kaohsiung at (22.6167, 120.25), at sea off Cijin, about 3 km west of
  the harbour.
port_limits:
  derive: hull
  buffer_m: 200
  clip: water
  disjoint: >-
    The 2nd Container Port is mapped as two areas: the terminal on the harbour, and a yard about 230 m
    back from the water, 15 m from the terminal, beside the 新生滯洪池 flood detention pond. Nothing OpenStreetMap
    maps joins the yard to the harbour, so it stands as a part of its own.
  note: >-
    OpenStreetMap maps no port limits for Kaohsiung. These are the hull of the 1st to 7th container centres,
    grown by 200 m and cut to the water OpenStreetMap maps inside it, with the centres kept whole: the
    harbour channel from the 1st centre down to the second harbour entrance, and the basins between the
    centres. Cijin and the Qianzhen waterfront are land and left out. A scan of OpenStreetMap finds no
    homes, schools, hospitals or places of worship inside. It finds two place names on the 6th centre
    for Hongmaogang (紅毛港), the village cleared to build it, a Tudigong label on the 4th centre, and at
    the edge 300 m² of an outdoor exhibition area by the 6th centre tagged as housing.
  accepts:
    residential_m2: 301
    places:
    - 紅毛港
