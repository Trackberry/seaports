---
locode: ESBIO
reviewed_at: '2026-11-23'
note: >-
  Drafted from rake seaports:geometry_candidates and a search of named features around the Abra and the
  ría. OpenStreetMap maps no anchorage off Bilbao, so none is listed. It names the outer-harbour quays
  (A-1 to AZ-6) but gives no operator or cargo for most of them; only the container quays are named for
  their operator. The Petronor jetties and the BBG LNG terminal are not mapped as terminals, so they are
  not here by name. Muelle A-6 is left out: the ferry terminal below sits wholly inside it and it carries
  no use of its own. The Muelle de Lutxana up the ría (relation/5612716) is left out: its hull would take
  in Portugalete, Barakaldo and Getxo.
position_outside: >-
  UN/LOCODE places Bilbao on the city (43.25, -2.9667), about 12 km up the ría from the outer harbour
  at Santurtzi, where every terminal mapped here is. A ship there is in the city, not at a terminal.
port_limits:
  derive: hull
  osm: way/110020916
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Bilbao. These are the hull of the outer harbour (way/110020916,
    tagged harbour=yes and named Bilbao Port), the terminals below and the Getxo cruise terminal across
    the Abra, grown by 300 m, then cut to the water OpenStreetMap maps inside it, with the terminals and
    those areas kept whole and a 30 m margin where they meet the water. A scan of OpenStreetMap finds
    no homes, schools, hospitals, places of worship or named places inside; the edge of an unnamed residential
    area on the Santurtzi side reaches in by about 900 m², none of it more than 10 m inside.
  accepts:
    residential_m2: 900
