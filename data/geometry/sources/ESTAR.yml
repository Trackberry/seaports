note: >-
  Drafted from rake seaports:geometry_candidates[ESTAR,10] and a search of named features around the harbour,
  repeated on 2026-11-23. OpenStreetMap maps the harbour itself but few of its terminals as areas: not
  the agribulk quays, the ro-ro berths or the Repsol monobuoy, whose quays are only named points. There
  is no container terminal to map: DP World gave up its Moll d'Andalusia concession in 2023, and the port
  awarded a new multipurpose terminal there to COSCO and PTP in 2026 (Alimarket, Diari de Tarragona).
  An unnamed industrial=port area (way/957609233) and an unnamed car depot (relation/14500019) are left
  out: OpenStreetMap names neither, and nothing ties either to a berth. OpenStreetMap maps no anchorage
  off Tarragona.
