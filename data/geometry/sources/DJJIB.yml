reviewed_at: '2026-11-23'
note: >-
  Drafted from a search of the Geofabrik Djibouti extract around Doraleh and the city. Djibouti's cargo
  is now handled at Doraleh, west of the city: the container terminal, the multipurpose port and the oil
  terminal. The historic port by the city centre is left out: Djibouti has moved its traffic to Doraleh
  and no current source says what cargo it still takes. The oil terminal is left out too: OpenStreetMap
  maps only its tank farm, Port pétrolier de Doraleh, which has no water within 30 m of it, and not the
  jetty where tankers berth. OpenStreetMap maps no anchorage for Djibouti.
