  note: >-
    The port area on the Colón waterfront, mapped as industrial land named Puerto de Cristóbal in OpenStreetMap,
    which links it to Panama Ports Company's website. Panama's Supreme Court annulled Panama Ports Company's
    concession in January 2026, and since late February 2026 TiL Panamá, part of MSC's Terminal Investment
    Limited, has run the port under a temporary contract of up to 18 months, as the Panamanian press reports.
