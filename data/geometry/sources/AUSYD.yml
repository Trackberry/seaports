locode: AUSYD
reviewed_at: '2026-11-23'
note: >-
  Drafted from rake seaports:geometry_candidates around Port Botany. Sydney's container trade is all at
  Port Botany, and carriers name it AUSYD on bills of lading; AUPBT (Port Botany) and AUBTB (Botany Bay)
  are the same place under other codes, so they are quays here. The Sydney Harbour wharves (Glebe Island,
  White Bay) are left out: they are 12 km north and take no containers. The Kurnell fuel terminal across
  the bay is left out too, and so are the Vopak tank farms behind the bulk liquids berth: OpenStreetMap
  maps the tanks, which have no water within 30 m, and not the berth.
quays:
- AUPBT
- AUBTB
position_outside: >-
  UN/LOCODE places Sydney on the city centre (-33.85, 151.2), about 12 km north of Port Botany. A ship
  there is in Sydney Harbour, not at a container terminal.
port_limits:
  derive: hull
  buffer_m: 300
  clip: water
  note: >-
    OpenStreetMap maps no port limits for Port Botany. These are the hull of the three container terminals
    below grown by 300 m, cut to the water OpenStreetMap maps inside it, with the terminals kept whole
    and a 30 m margin where they meet the water. What is left is the terminals and the water off them
    in Botany Bay, not Botany, Banksmeadow or La Perouse. A scan of OpenStreetMap finds no homes, residential
    land, schools, hospitals or places of worship inside; the suburb named Port Botany is the terminals'
    own ground.
